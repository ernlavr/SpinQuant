method: grid # grid, bayes, random
metric:
  name: 'loss'
  goal: 'minimize'

parameters:
  l2_regularizer_scale:
    values:
      - 0.00001
      - 0.000001
      - 0
  
  add_regularizing_noise:
    values:
      - 1e-6
      - null

  scheduler_name:
    values:
      - none
      - plateau

  optimizer_constraint:
    values:
      - adamw

  learning_rate:
    values:
      - 0.005